name: Refresh agent data from sheet

on:
  # Every 4 hours at :23 past the hour
  schedule:
    - cron: "23 */4 * * *"
  # Manual button in GitHub UI → Actions → Refresh agent data → Run workflow
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download latest sheet
        run: |
          curl -fsSL "https://docs.google.com/spreadsheets/d/1AuNeVPAhWvdFvHiSIIz1UW6sgTMYSmIy05wTo42uVdY/export?format=csv&gid=644049566" -o agents-source.csv
          echo "Source rows: $(wc -l < agents-source.csv)"

      - name: Re-geocode (cache makes repeat runs fast)
        run: python3 scripts/geocode_v2.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/agents.json scripts/.geocache_v2.json
          if git diff --cached --quiet; then
            echo "No data changes — sheet unchanged since last run."
          else
            STAT=$(git diff --cached --stat)
            git commit -m "chore: refresh agent data from sheet

          $STAT"
            git push
            echo "Pushed updated data — Vercel will auto-deploy."
          fi
