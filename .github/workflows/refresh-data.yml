name: Refresh agent data from sheet

on:
  # Every 30 min (at :17 and :47 past)
  schedule:
    - cron: "17,47 * * * *"
  # Manual button in GitHub UI → Actions → Refresh agent data → Run workflow
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Whole-job cap: normally finishes in <2 min. Bumped from 10 → 15 min
    # after the sheet grew to ~1,700 rows and cold-cache runs need more room.
    # The per-step timeouts still catch true hangs (curl / geocode).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download latest sheet
        timeout-minutes: 2
        run: |
          curl -fsSL --max-time 60 --retry 2 --retry-delay 5 \
            "https://docs.google.com/spreadsheets/d/1AuNeVPAhWvdFvHiSIIz1UW6sgTMYSmIy05wTo42uVdY/export?format=csv&gid=644049566" \
            -o agents-source.csv
          echo "Source rows: $(wc -l < agents-source.csv)"

      - name: Re-geocode (cache makes repeat runs fast)
        timeout-minutes: 9
        run: python3 scripts/geocode_v2.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/agents.json scripts/.geocache_v2.json
          if git diff --cached --quiet; then
            echo "No data changes — sheet unchanged since last run."
          else
            STAT=$(git diff --cached --stat)
            git commit -m "chore: refresh agent data from sheet

          $STAT"
            git push
            echo "Pushed updated data — Vercel will auto-deploy."
          fi
